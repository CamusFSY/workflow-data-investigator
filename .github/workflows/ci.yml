name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  investigator:
    name: Investigator / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run real tool, protocol and replay tests
        working-directory: data-investigation-agent
        run: python -B -m unittest discover -s tests -v
      - name: Build wheel and source distribution
        run: |
          python -m pip install 'build>=1.2,<2'
          python -m build data-investigation-agent --outdir dist/investigator
      - name: Exercise the installed wheel away from the checkout
        run: |
          python -m venv "$RUNNER_TEMP/investigator-wheel"
          "$RUNNER_TEMP/investigator-wheel/bin/python" -m pip install --no-deps dist/investigator/*.whl
          python scripts/smoke_distribution.py --python "$RUNNER_TEMP/investigator-wheel/bin/python"
